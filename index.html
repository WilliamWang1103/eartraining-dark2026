    <div id="rhythm-page" class="page">
        <div class="container">
            <div class="exercise-page">
                <div class="exercise-header">
                    <h2 class="exercise-title"><i class="fas fa-drum"></i> 节奏听辨练习</h2>
                    <button id="back-home-rhythm" class="back-btn" title="返回首页">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div class="window-controls">
                        <button id="fullscreen-btn-rhythm" class="window-btn" title="全屏">
                            <i class="fas fa-expand"></i>
                        </button>
                        <button id="close-btn-rhythm" class="window-btn" title="关闭">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>

                <!-- 模式切换标签 -->
                <div class="mode-tabs">
                    <button id="practice-btn-rhythm" class="tab-btn active">练习模式</button>
                    <button id="test-btn-rhythm" class="tab-btn secondary">测试模式</button>
                    <button id="leaderboard-btn-rhythm" class="tab-btn exam">风云榜单</button>
                    <button id="end-test-btn-rhythm" class="tab-btn warning" style="display: none;">结束测试</button>
                </div>

                <!-- 功能标签：节奏型听辨 / 节拍听辨 -->
                <div class="function-tabs">
                    <button id="rhythm-identify-btn" class="function-tab active">节奏型听辨</button>
                    <button id="rhythm-meter-btn" class="function-tab">节拍听辨</button>
                </div>

                <div id="practice-test-content-rhythm">
                    <!-- 计分板（测试模式显示） -->
                    <div class="stats-panel" id="stats-panel-rhythm" style="display: none;">
                        <div class="stat-item">
                            <div class="stat-value" id="score-rhythm">0</div>
                            <div class="stat-label">得分</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="correct-rhythm">0</div>
                            <div class="stat-label">正确</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="wrong-rhythm">0</div>
                            <div class="stat-label">错误</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="progress-rhythm">0/20</div>
                            <div class="stat-label">进度</div>
                        </div>
                    </div>

                    <!-- 时间显示（测试模式显示） -->
                    <div class="time-panel" id="time-panel-rhythm" style="display: none;">
                        <div class="current-time">当前时间：</div>
                        <div class="time-display" id="current-time-rhythm">--</div>
                    </div>

                    <!-- 练习说明 -->
                    <div class="practice-instructions" id="practice-instructions-rhythm">
                        <h4>📖 练习说明</h4>
                        <ul>
                            <li><strong>随机播放：</strong>根据所选拍型和数量随机出题，播放节奏音响</li>
                            <li><strong>重复播放：</strong>重复播放最后一题的节奏音响</li>
                            <li><strong>播放上屏节奏：</strong>播放您在答案区选择的节奏</li>
                            <li><strong>提交答案：</strong>确认您选择的节奏型</li>
                            <li><strong>显示答案：</strong>查看正确答案</li>
                            <li><strong>1拍节奏型：</strong>四分、八分、十六分等基础节奏</li>
                            <li><strong>2拍节奏型：</strong>二分、附点、切分等复合节奏</li>
                        </ul>
                    </div>

                    <!-- 节拍器控制区 -->
                    <div class="rhythm-metronome-section">
                        <div class="metronome-control">
                            <label for="rhythm-bpm">节拍器 (BPM)</label>
                            <div class="metronome-slider">
                                <input id="rhythm-bpm" type="range" min="40" max="200" value="66">
                                <span id="bpm-display-rhythm">66</span>
                            </div>
                        </div>
                        <div class="metronome-actions">
                            <button id="toggle-metronome-rhythm" class="btn">节拍器 开</button>
                            <button id="reset-test-btn-rhythm" class="reset-btn">清零</button>
                        </div>
                    </div>

                    <!-- 状态消息 -->
                    <div id="status-rhythm" class="status-message">请选择模式开始练习</div>

                    <!-- 参数选择：拍型与数量 -->
                    <div class="rhythm-params-section">
                        <div class="param-group">
                            <label for="beat-type-rhythm">拍型</label>
                            <select id="beat-type-rhythm">
                                <option value="1">一拍（四分）</option>
                                <option value="2">二拍（二分）</option>
                            </select>
                        </div>
                        <div class="param-group">
                            <label for="quantity-rhythm">数量</label>
                            <select id="quantity-rhythm">
                                <option value="2">2</option>
                                <option value="4">4</option>
                                <option value="6">6</option>
                                <option value="8">8</option>
                            </select>
                        </div>
                    </div>

                    <!-- 答案上屏区 -->
                    <div id="rhythm-answer-area" class="rhythm-answer-area">
                        <!-- 槽位由JS动态生成 -->
                    </div>

                    <!-- 节奏型选项卡 -->
                    <div class="rhythm-tabs-section">
                        <div id="rhythm-type-tabs" class="rhythm-tabs">
                            <button class="rhythm-tab-btn active" data-type="1">1拍节奏型</button>
                            <button class="rhythm-tab-btn" data-type="2">2拍节奏型</button>
                        </div>
                        
                        <!-- 1拍节奏型按钮 -->
                        <div id="rhythm-type-1" class="rhythm-type-content active">
                            <div class="rhythm-buttons-grid">
                                <button class="rhythm-btn" data-rhythm="四分">四分</button>
                                <button class="rhythm-btn" data-rhythm="2个八分">2个八分</button>
                                <button class="rhythm-btn" data-rhythm="4个十六分">4个十六分</button>
                                <button class="rhythm-btn" data-rhythm="后十六">后十六</button>
                                <button class="rhythm-btn" data-rhythm="小切分">小切分</button>
                                <button class="rhythm-btn" data-rhythm="前十六">前十六</button>
                                <button class="rhythm-btn" data-rhythm="小附点">小附点</button>
                                <button class="rhythm-btn" data-rhythm="小后附点">小后附点</button>
                                <button class="rhythm-btn" data-rhythm="三连音">三连音</button>
                            </div>
                        </div>
                        
                        <!-- 2拍节奏型按钮 -->
                        <div id="rhythm-type-2" class="rhythm-type-content">
                            <div class="rhythm-buttons-grid">
                                <button class="rhythm-btn" data-rhythm="二分">二分</button>
                                <button class="rhythm-btn" data-rhythm="八分大切分">八分大切分</button>
                                <button class="rhythm-btn" data-rhythm="十六分大切分">十六分大切分</button>
                                <button class="rhythm-btn" data-rhythm="前十六大切分">前十六大切分</button>
                                <button class="rhythm-btn" data-rhythm="后十六大切分">后十六大切分</button>
                                <button class="rhythm-btn" data-rhythm="八分大附点">八分大附点</button>
                                <button class="rhythm-btn" data-rhythm="八分大后附点">八分大后附点</button>
                                <button class="rhythm-btn" data-rhythm="十六分大附点">十六分大附点</button>
                                <button class="rhythm-btn" data-rhythm="十六分大后附点">十六分大后附点</button>
                            </div>
                        </div>
                    </div>

                    <!-- 手写区域 -->
                    <div class="rhythm-handwriting-section">
                        <div class="handwriting-controls">
                            <button id="handwrite-mode-btn" class="btn">写（已启用）</button>
                            <button id="hand-erase-btn" class="btn">擦</button>
                            <span class="handwriting-hint">（触屏或鼠标绘图，擦会清空画布）</span>
                        </div>
                        <canvas id="rhythm-canvas" width="800" height="120"></canvas>
                    </div>

                    <!-- 测试结果显示区 -->
                    <div id="test-result-rhythm" class="test-result"></div>
                    <div id="test-analysis-rhythm" class="test-analysis"></div>

                    <!-- 底部控制按钮 -->
                    <div class="play-controls" id="play-controls-rhythm">
                        <button id="random-play-btn-rhythm" class="btn"><i class="fas fa-random"></i> 随机播放</button>
                        <button id="play-btn-rhythm" class="btn secondary"><i class="fas fa-play"></i> 重复播放</button>
                        <button id="play-melodic-btn-rhythm" class="btn" title="播放您上屏的节奏"><i class="fas fa-music"></i> 播放上屏节奏</button>
                        <button id="submit-btn-rhythm" class="btn"><i class="fas fa-check"></i> 提交答案</button>
                        <button id="show-answer-btn-rhythm" class="btn answer-btn">显示答案</button>
                    </div>
                </div>

                <!-- 风云榜单 -->
                <div id="leaderboard-content-rhythm" style="display: none;">
                    <div class="leaderboard-panel">
                        <div class="leaderboard-config-info" id="leaderboard-config-rhythm" style="text-align: center; padding: 10px; color: rgba(255, 255, 255, 0.7); font-size: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 10px;">
                            <!-- 配置信息将动态显示 -->
                        </div>
                        <div class="leaderboard-table">
                            <div class="leaderboard-header">
                                <div class="lb-col lb-rank">排名</div>
                                <div class="lb-col lb-name">姓名</div>
                                <div class="lb-col lb-score">得分</div>
                                <div class="lb-col lb-time">用时</div>
                            </div>
                            <div id="leaderboard-list-rhythm" class="leaderboard-list">
                                <!-- 榜单数据将动态生成 -->
                            </div>
                        </div>
                        <div class="leaderboard-footer">
                            <button id="clear-leaderboard-btn-rhythm" class="btn warning">清空榜单</button>
                            <button id="back-from-leaderboard-btn-rhythm" class="btn">返回</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
